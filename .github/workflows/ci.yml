# CI for the Revenue Forecasting Platform.
#
# NOTE: this file is NOT in the repository yet. The GitHub API integration
# used for publishing returns 403 for `.github/workflows/`, so add this
# file via the GitHub web UI: repo -> Add file -> Create new file ->
# path `.github/workflows/ci.yml` -> paste these exact contents -> Commit.
# Do not claim CI exists until this file is visible on the main branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q src tests run_*.py

      - name: Tests
        run: python run_tests.py

      - name: Ingest + train smoke (reproduces metrics)
        run: |
          python run_ingest.py
          python run_train.py

      - name: Execute notebooks
        run: |
          python -m ipykernel install --user --name python3 --display-name "Python 3"
          python -m jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=600 \
            nb/analysis.ipynb nb/results.ipynb
          git diff --exit-code -- nb/ || echo "notebooks re-executed (outputs differ from committed versions; update them if this is a data change)"
